<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear formulario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<header>
    <h1>Crear formulario</h1>
    <a href="{{ url_for('panel') }}">Volver al panel</a>
</header>

<main>
    <section class="card">
        <h2>Nuevo formulario condicional</h2>

        <form method="POST">
            <label>Título del formulario</label>
            <input type="text" name="titulo" required>

            <label>Plantilla del formulario</label>
            <textarea name="plantilla" rows="14" required>{{ plantilla_ejemplo }}</textarea>

            <button type="submit">Guardar formulario</button>
        </form>
    </section>
</main>

</body>
</html>
